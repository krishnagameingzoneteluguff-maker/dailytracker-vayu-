<!DOCTYPE html>
<html>
<head>
  <title>Vayu Tracker</title>
  <style>
    body { font-family: Arial; background: #111; color: white; text-align: center; }
    input { padding: 10px; }
    button { padding: 10px; margin: 5px; }
    li { margin: 10px; }
  </style>
</head>
<body>

<h1>🔥 Vayu Daily Tracker</h1>

<h3 id="streak">Streak: 0 🔥</h3>
<h3 id="xp">XP: 0 ⚡</h3>
<h3 id="progress">Progress: 0%</h3>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
const API = "http://localhost:3000";

async function loadTasks() {
  const res = await fetch(API + "/tasks");
  const tasks = await res.json();

  let list = document.getElementById("taskList");
  list.innerHTML = "";

  let completed = 0;

  tasks.forEach(task => {
    if (task.completed) completed++;

    let li = document.createElement("li");

    li.innerHTML = `
      <input type="checkbox" ${task.completed ? "checked" : ""} 
        onchange="toggleTask('${task._id}')">
      <span style="${task.completed ? 'text-decoration: line-through;' : ''}">
        ${task.text}
      </span>
      <button onclick="deleteTask('${task._id}')">❌</button>
    `;

    list.appendChild(li);
  });

  updateStats(tasks.length, completed);
}

async function addTask() {
  let input = document.getElementById("taskInput");

  if (input.value === "") return;

  await fetch(API + "/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: input.value })
  });

  input.value = "";
  loadTasks();
}

async function toggleTask(id) {
  await fetch(API + "/tasks/" + id, {
    method: "PUT"
  });
  loadTasks();
}

async function deleteTask(id) {
  await fetch(API + "/tasks/" + id, {
    method: "DELETE"
  });
  loadTasks();
}

function updateStats(total, completed) {
  let percent = total === 0 ? 0 : (completed / total) * 100;

  document.getElementById("progress").innerText =
    `Progress: ${completed}/${total} (${percent.toFixed(0)}%)`;

  let xp = completed * 10;
  document.getElementById("xp").innerText = `XP: ${xp} ⚡`;

  let streak = localStorage.getItem("streak") || 0;

  if (total > 0 && completed === total) {
    streak++;
    localStorage.setItem("streak", streak);
  }

  document.getElementById("streak").innerText = `Streak: ${streak} 🔥`;
}

loadTasks();
</script>

</body>
</html>
